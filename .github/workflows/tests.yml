# Runs the addon's tests (Lua 5.1 + busted) on every push and pull request,
# in the same Docker image scripts/test.ps1 uses locally.

name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the test image
        run: docker build --tag aztecgambling-tests spec

      - name: Run the tests
        run: docker run --rm --volume "$PWD:/addon" aztecgambling-tests
